name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: linux
            asset_pattern: |
              release/*.AppImage
              release/*.deb

          - os: windows-latest
            build_script: build:win
            artifact_name: windows
            asset_pattern: |
              release/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "::error::package.json was not found."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. npm ci requires a lockfile."
            exit 1
          fi

          node --version
          npm --version
          npm run

      - name: Install dependencies
        run: npm ci

      - name: Build application
        shell: bash
        run: npm run "${{ matrix.build_script }}"

      - name: Debug build output
        shell: bash
        run: |
          set -euo pipefail

          echo "Current directory:"
          pwd

          echo "Available build directories:"
          find . -maxdepth 4 -type d \
            \( -name dist -o -name release -o -name out -o -name build \) \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print

          echo "Generated installer files:"
          find . -type f \
            \( -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \) \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          echo "Searching for generated Windows executables..."

          while IFS= read -r -d '' file; do
            destination="release/$(basename "$file")"

            # Do not copy a file onto itself.
            if [ "$(realpath "$file")" != "$(realpath -m "$destination")" ]; then
              cp "$file" "$destination"
              echo "Collected: $file -> $destination"
            fi
          done < <(
            find . \
              -type f \
              -iname '*.exe' \
              -not -path './node_modules/*' \
              -not -path './.git/*' \
              -not -path './release/*' \
              -print0
          )

          echo "Collected Windows executables:"
          find release -maxdepth 1 -type f -iname '*.exe' -print

          if ! find release -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q .; then
            echo "::error::No Windows executables were generated."
            exit 1
          fi

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          echo "Searching for generated Linux installers..."

          while IFS= read -r -d '' file; do
            destination="release/$(basename "$file")"

            # Do not copy a file onto itself.
            if [ "$(realpath "$file")" != "$(realpath -m "$destination")" ]; then
              cp "$file" "$destination"
              echo "Collected: $file -> $destination"
            fi
          done < <(
            find . \
              -type f \
              \( -iname '*.AppImage' -o -iname '*.deb' \) \
              -not -path './node_modules/*' \
              -not -path './.git/*' \
              -not -path './release/*' \
              -print0
          )

          echo "Collected Linux installers:"
          find release -maxdepth 1 -type f \
            \( -iname '*.AppImage' -o -iname '*.deb' \) \
            -print

          if ! find release -maxdepth 1 -type f \
            \( -iname '*.AppImage' -o -iname '*.deb' \) \
            -print -quit | grep -q .; then
            echo "::error::No Linux installers were generated."
            exit 1
          fi

      - name: Validate build artifacts
        shell: bash
        env:
          ASSET_PATTERNS: ${{ matrix.asset_pattern }}
        run: |
          set -euo pipefail

          if [ ! -d release ]; then
            echo "::error::The release directory does not exist."
            exit 1
          fi

          shopt -s nullglob

          found=0

          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue

            matches=( $pattern )

            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::No build artifacts found for pattern: $pattern"
              exit 1
            fi

            for file in "${matches[@]}"; do
              if [ -f "$file" ]; then
                echo "Found artifact: $file"
                found=$((found + 1))
              fi
            done
          done <<< "$ASSET_PATTERNS"

          if [ "$found" -eq 0 ]; then
            echo "::error::No valid release artifacts found."
            exit 1
          fi

          echo "Validated $found artifact(s)."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build
          path: ${{ matrix.asset_pattern }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  generate-release-notes:
    name: Generate Release Notes
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      release_notes: ${{ steps.generate.outputs.notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: generate
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          COMMITS_FILE="$RUNNER_TEMP/commits.txt"
          RESPONSE_FILE="$RUNNER_TEMP/ollama-response.json"

          # Fetch the manually selected release tag when necessary.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

            RELEASE_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          fi

          # Find the previous reachable tag.
          LAST_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              "${RELEASE_SHA}^" 2>/dev/null || true
          )

          echo "Current release: $RELEASE_TAG"

          if [ -n "$LAST_TAG" ]; then
            echo "Previous release: $LAST_TAG"

            git log \
              --no-renames \
              --pretty=format:'- %s (%an)' \
              "${LAST_TAG}..${RELEASE_SHA}" \
              > "$COMMITS_FILE"
          else
            echo "No previous tag found. Using available commit history."

            git log \
              --no-renames \
              --pretty=format:'- %s (%an)' \
              "$RELEASE_SHA" \
              > "$COMMITS_FILE"
          fi

          if [ ! -s "$COMMITS_FILE" ]; then
            printf '%s\n' "No new commits were found for this release." \
              > "$COMMITS_FILE"
          fi

          echo "Commit history:"
          cat "$COMMITS_FILE"

          # Create fallback notes before attempting the API request.
          cat > "$NOTES_FILE" <<EOF
          ## What's New

          Changes included in release $RELEASE_TAG.

          See the commit history for details.
          EOF

          # A missing API key must not prevent the release.
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "::warning::OLLAMA_CLOUD_KEY is not configured. Using fallback release notes."
          else
            PROMPT_FILE="$RUNNER_TEMP/release-prompt.txt"

            cat > "$PROMPT_FILE" <<'PROMPT'
          You write release notes for an Electron desktop drawing application built with React and TypeScript.

          Create concise, accurate, user-friendly Markdown release notes based ONLY on the supplied commit history.

          Requirements:
          - Use the heading "## What's New".
          - Group changes under short subheadings when useful, such as Features, Fixes, and Improvements.
          - Explain changes in language understandable to end users.
          - Keep each bullet concise.
          - Do not invent features, fixes, or other changes.
          - Exclude internal maintenance changes unless they matter to users.
          - Do not include a Downloads section; it will be added separately.
          - If the history contains no meaningful user-facing changes, say so briefly.
          - Return Markdown only, without a preamble or code fences.

          Commit history:
          PROMPT

            printf '\n' >> "$PROMPT_FILE"
            cat "$COMMITS_FILE" >> "$PROMPT_FILE"

            PROMPT="$(cat "$PROMPT_FILE")"

            PAYLOAD="$(
              jq -n \
                --arg model "gpt-oss:120b-cloud" \
                --arg prompt "$PROMPT" \
                '{
                  model: $model,
                  messages: [
                    {
                      role: "user",
                      content: $prompt
                    }
                  ],
                  stream: false,
                  options: {
                    temperature: 0.3,
                    num_predict: 2048
                  }
                }'
            )"

            echo "Requesting release notes from Ollama Cloud..."

            if curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 10 \
              --max-time 120 \
              --retry 2 \
              --retry-delay 2 \
              -X POST "https://ollama.com/api/chat" \
              -H "Authorization: Bearer $OLLAMA_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary "$PAYLOAD" \
              --output "$RESPONSE_FILE"; then

              NOTES="$(
                jq -er '
                  .message.content
                  | select(type == "string")
                  | select(length > 0)
                ' "$RESPONSE_FILE" 2>/dev/null || true
              )"

              if [ -n "$NOTES" ]; then
                printf '%s\n' "$NOTES" > "$NOTES_FILE"
                echo "Successfully generated AI release notes."
              else
                echo "::warning::Ollama returned an invalid or empty response. Using fallback release notes."
              fi
            else
              echo "::warning::Ollama API request failed. Using fallback release notes."

              if [ -s "$RESPONSE_FILE" ]; then
                echo "Ollama error response:"
                head -c 2000 "$RESPONSE_FILE" || true
                echo
              fi
            fi
          fi

          # Append platform-specific download instructions.
          cat >> "$NOTES_FILE" <<'EOF'

          ## Downloads

          - **Windows:** Download the `.exe` installer.
          - **Linux:** Download the `.AppImage` or `.deb` package, as available.
          EOF

          echo "Final release notes:"
          cat "$NOTES_FILE"

          # Safely export multiline Markdown to GitHub Actions.
          DELIMITER="RELEASE_NOTES_$(openssl rand -hex 16)"

          {
            echo "notes<<$DELIMITER"
            cat "$NOTES_FILE"
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs:
      - build
      - generate-release-notes

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d artifacts ]; then
            echo "::error::The artifacts directory does not exist."
            exit 1
          fi

          echo "Downloaded files:"
          find artifacts -type f -print | sort

          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "::error::No release artifacts were downloaded."
            exit 1
          fi

          echo "Artifact validation successful."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          body: ${{ needs.generate-release-notes.outputs.release_notes }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
